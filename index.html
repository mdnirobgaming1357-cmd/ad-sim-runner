<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Simulation Runner</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- NOTE: no real ad SDK is loaded on this page. The CSP also blocks external scripts. -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="panel">
    <h1>sim-runner login</h1>
    <p class="muted">Admin access only. Simulation data is TEST_ONLY.</p>
    <label>Username <input id="user" autocomplete="username" required></label>
    <label>Password <input id="pass" type="password" autocomplete="current-password" required></label>
    <p id="loginErr" class="err" role="alert"></p>
    <button class="btn go" type="submit">Sign in</button>
  </form>
</section>

<main id="dash" hidden>
  <header class="top">
    <div>
      <h1>ad-sim-runner<span class="cursor">_</span></h1>
      <p class="muted">Isolated test harness. Nothing here touches a real ad network.</p>
    </div>
    <div class="top-r">
      <span id="badge" class="badge stopped">STOPPED</span>
      <button id="logout" class="btn ghost">Sign out</button>
    </div>
  </header>

  <section class="controls">
    <button id="start" class="btn go">START</button>
    <button id="stop" class="btn stop">STOP</button>
    <button id="restart" class="btn warn">RESTART</button>
  </section>

  <section class="cards">
    <div class="card"><span>Server uptime</span><b id="upSrv">0s</b></div>
    <div class="card"><span>Runner uptime</span><b id="upRun">0s</b></div>
    <div class="card"><span>Impressions</span><b id="sImp">0</b></div>
    <div class="card"><span>Clicks</span><b id="sClk">0</b></div>
    <div class="card"><span>Total events</span><b id="sTot">0</b></div>
    <div class="card"><span>Bot / repeat / invalid</span><b id="sOth">0 / 0 / 0</b></div>
    <div class="card"><span>Worker restarts</span><b id="sRst">0</b></div>
    <div class="card"><span>Worker PID</span><b id="sPid">-</b></div>
  </section>

  <section class="panel term-wrap">
    <div class="term-bar">
      <span>live logs</span>
      <span><label class="chk"><input id="scroll" type="checkbox" checked> auto-scroll</label>
      <button id="clear" class="btn ghost sm">Clear view</button></span>
    </div>
    <pre id="term" class="term" aria-live="polite"></pre>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
